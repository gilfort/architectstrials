name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # Starts a headless GameTest server that runs every registered GameTest and exits.
      # The server exits with a non-zero code (failing this step) if a required test fails.
      - name: Run GameTests
        run: ./gradlew runGameTestServer

      - name: Summarize failed GameTests
        if: failure()
        run: |
          for log in run/logs/latest.log build/run/gameTestServer/logs/latest.log; do
            [ -f "$log" ] && grep -E "GAME TESTS COMPLETE|required tests? failed|^\[.*\] \[Server thread/ERROR\]" "$log" | tail -40 || true
          done

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: architectstrials-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload GameTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs-${{ github.sha }}
          path: |
            run/logs/
            build/run/gameTestServer/logs/
          if-no-files-found: ignore


      # TEMPORARY: prints client render signatures for the exit camouflage (US-34); removed again afterwards.
      - name: Inspect render classes
        if: always()
        run: |
          jars=$(find build ~/.gradle -name "*.jar" 2>/dev/null | xargs -I{} sh -c 'unzip -l "{}" 2>/dev/null | grep -qE "net/neoforged/neoforge/client/event/ModelEvent|client/renderer/SubmitNodeCollector.class" && echo "{}"' | sort -u)
          echo "JARS: $jars"
          cp=$(echo $jars | tr ' ' ':')
          for j in $jars; do unzip -l "$j" | awk '{print $4}' | grep -E "/(ModelData|ModelProperty|BlockStateModel|BlockModelPart|DelegateBlockStateModel|ModelEvent\$ModifyBakingResult|BlockEntityExtension|BlockStateModelExtension|BlockModelPartExtension|BlockAndTintGetterExtension|BlockColors|BlockTintSource|BlockTintSources|RegisterColorHandlersEvent\$Block|ChunkSectionLayer|SimpleModelWrapper)\.class$"; done | sort -u > classes.txt
          cat classes.txt
          for c in $(sed 's#\.class$##; s#/#.#g' classes.txt); do
            echo "=== $c"; javap -cp "$cp" "$c" | grep -v "lambda\$\|^Compiled\|^}" || true
          done

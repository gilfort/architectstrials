name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # Starts a headless GameTest server that runs every registered GameTest and exits.
      # The server exits with a non-zero code (failing this step) if a required test fails.
      - name: Run GameTests
        run: ./gradlew runGameTestServer

      - name: Summarize failed GameTests
        if: failure()
        run: |
          for log in run/logs/latest.log build/run/gameTestServer/logs/latest.log; do
            [ -f "$log" ] && grep -E "GAME TESTS COMPLETE|required tests? failed|^\[.*\] \[Server thread/ERROR\]" "$log" | tail -40 || true
          done

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: architectstrials-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload GameTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs-${{ github.sha }}
          path: |
            run/logs/
            build/run/gameTestServer/logs/
          if-no-files-found: ignore



      # TEMPORARY: prints client render signatures for the exit camouflage (US-34); removed again afterwards.
      - name: Inspect render classes
        if: always()
        run: |
          src=$(find ~/.gradle -name "neoforge-*-sources.jar" | head -1)
          mc=build/moddev/artifacts/minecraft-patched-26.3.0.34-beta.jar
          mkdir -p /tmp/nfsrc && cd /tmp/nfsrc && unzip -q -o "$src" && cd - > /dev/null
          echo "--- getModelData / requestModelDataUpdate"
          grep -rn "ModelData getModelData\|void requestModelDataUpdate\|ModelData getModelData(" /tmp/nfsrc --include=*.java | sed 's#/tmp/nfsrc/##' | head -20
          echo "--- ModifyBakingResult"
          grep -rn -A3 "class ModifyBakingResult" /tmp/nfsrc --include=*.java | sed 's#/tmp/nfsrc/##' | head -8
          grep -n "public .*(" /tmp/nfsrc/net/neoforged/neoforge/client/event/ModelEvent.java | head -30
          echo "--- render_type / colors"
          grep -rln "render_type\|RegisterColorHandlersEvent\|BlockTintSource" /tmp/nfsrc --include=*.java | sed 's#/tmp/nfsrc/##' | head -20
          grep -n "public .*(" /tmp/nfsrc/net/neoforged/neoforge/client/event/RegisterColorHandlersEvent.java | head -20
          echo "--- BlockStateModelPart extension"
          ls /tmp/nfsrc/net/neoforged/neoforge/client/extensions/ | tr '\n' ' '
          echo
          grep -n "default\|interface" /tmp/nfsrc/net/neoforged/neoforge/client/extensions/BlockStateModelPartExtension.java 2>/dev/null | head
          echo "--- javap"
          unzip -l $mc | awk '{print $4}' | grep -E "client/renderer/block/dispatch/[A-Za-z]*\.class$|client/renderer/block/BlockAndTintGetter|/BlockColors.class|/BlockTintSource|client/renderer/chunk/ChunkSectionLayer.class" | tr '\n' ' '
          echo
          for c in client.renderer.block.dispatch.BlockStateModel client.renderer.block.dispatch.BlockStateModelPart client.renderer.block.BlockAndTintGetter; do
            echo "=== $c"; javap -cp "$mc" "net.minecraft.$c" | grep -v 'lambda\$\|^Compiled\|^}' | sed 's/net\.minecraft\.//g; s/java\.util\.//g' || true
          done
